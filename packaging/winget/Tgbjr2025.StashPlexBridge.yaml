ShortDescription: One-command Windows installer for three Stash↔Plex bridge plugins.
Description: |
  stash-plex-bridge wires three Stash↔Plex synchronisation plugins
  (Stash2Plex, PlexSync, StashPlexAgent.bundle) into one idempotent,
  re-runnable PowerShell installer. Detects Stash and Plex installs,
  extracts tokens, renders per-plugin configs, and validates the
  end-to-end pipeline.
